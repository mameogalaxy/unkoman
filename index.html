<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#7a4a1d" />
<title>うんこマン -UNKOMAN-</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#1a1208;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:none; }
  #game { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }

  /* UI overlay */
  .ui { position:absolute; pointer-events:none; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,.6); }
  #hud { top:env(safe-area-inset-top,0); left:0; right:0; padding:14px 18px;
    display:flex; justify-content:space-between; align-items:flex-start; font-weight:700; }
  #dist { font-size:15px; opacity:.9; }
  #dist b { font-size:30px; }
  #best { font-size:14px; text-align:right; opacity:.85; }

  /* power gauge */
  #gaugeWrap { position:absolute; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0)); transform:translateX(-50%);
    width:min(78vw,420px); pointer-events:none; }
  #gaugeLabel { text-align:center; color:#ffe9b0; font-weight:800; font-size:14px; letter-spacing:1px;
    text-shadow:0 2px 4px rgba(0,0,0,.6); margin-bottom:6px; }
  #gauge { height:18px; border-radius:12px; background:rgba(0,0,0,.4);
    border:2px solid rgba(255,255,255,.35); overflow:hidden; }
  #gaugeFill { height:100%; width:0%; border-radius:10px;
    background:linear-gradient(90deg,#ffe36e,#ff8a3d,#ff3d3d); transition:width .05s linear; }
  #rpm { text-align:center; color:#fff; font-weight:800; font-size:13px; margin-top:5px; opacity:.85; }

  /* center shout */
  #shout { left:0; right:0; top:34%; text-align:center; font-weight:900; font-size:58px;
    color:#fff; -webkit-text-stroke:3px #b5450a; opacity:0; transform:scale(.4) rotate(-6deg); }
  #shout.go { animation:pop 1.1s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes pop { 0%{opacity:0;transform:scale(.3) rotate(-10deg);} 18%{opacity:1;transform:scale(1.15) rotate(4deg);}
    35%{transform:scale(1) rotate(-2deg);} 80%{opacity:1;transform:scale(1) rotate(0);} 100%{opacity:0;transform:scale(1.05);} }

  /* instruction hint */
  #hint { left:50%; top:46%; transform:translate(-50%,-50%); text-align:center;
    color:#fff; font-weight:800; font-size:18px; line-height:1.7; opacity:.95; }
  #hint .big { font-size:26px; color:#ffd23d; }
  #hint .swirl { font-size:50px; display:block; animation:spin 1.6s linear infinite; }
  @keyframes spin { from{transform:rotate(0);} to{transform:rotate(360deg);} }

  /* title / result screen */
  .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:18px; padding:30px; z-index:5;
    background:radial-gradient(120% 90% at 50% 30%, rgba(60,38,12,.4), rgba(10,7,2,.82)); }
  .screen.hidden { display:none; }
  .screen h1 { color:#ffd23d; font-size:46px; font-weight:900; -webkit-text-stroke:2px #6b3a10;
    text-shadow:0 6px 0 #6b3a10; line-height:1.1; }
  .screen .sub { color:#fff; font-size:16px; opacity:.9; line-height:1.7; }
  .screen .em { font-size:62px; }
  .screen .resultDist { color:#fff; font-weight:900; }
  .screen .resultDist b { color:#ffe36e; font-size:54px; }
  .btn { pointer-events:auto; cursor:pointer; border:none; border-radius:999px;
    padding:16px 40px; font-size:22px; font-weight:900; color:#5a2d05;
    background:linear-gradient(180deg,#ffe06a,#ffb02e); box-shadow:0 6px 0 #b5701a, 0 10px 18px rgba(0,0,0,.4);
    transition:transform .08s, box-shadow .08s; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #b5701a, 0 5px 10px rgba(0,0,0,.4); }
  .rank { font-size:30px; font-weight:900; color:#fff; }
  .muteBtn { position:absolute; top:env(safe-area-inset-top,8px); right:10px; pointer-events:auto; cursor:pointer;
    background:rgba(0,0,0,.3); border:1.5px solid rgba(255,255,255,.4); color:#fff; border-radius:999px;
    width:42px; height:42px; font-size:18px; z-index:6; }
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <!-- in-game HUD -->
  <div id="hud" class="ui">
    <div id="dist">飛距離<br><b id="distVal">0.0</b> m</div>
    <div id="best">最高記録<br><span id="bestVal">0.0</span> m</div>
  </div>

  <div id="hint" class="ui">
    <span class="swirl">🌀</span>
    ウンコを<span class="big">グリグリ</span>回して<br>勢いをためろ！
  </div>

  <div id="gaugeWrap" class="ui">
    <div id="gaugeLabel">いきおい</div>
    <div id="gauge"><div id="gaugeFill"></div></div>
    <div id="rpm">0 RPM</div>
  </div>

  <div id="shout" class="ui">ナイスウンコ！！</div>

  <button class="muteBtn" id="muteBtn" title="サウンド">🔊</button>

  <!-- title -->
  <div class="screen" id="titleScreen">
    <div class="em">💩</div>
    <h1>うんこマン<br>UNKOMAN</h1>
    <div class="sub">指でウンコの先っぽを<b>グリグリ回転</b>させて<br>いきおいをため、はなして遠投！<br>どこまで飛ばせるか勝負だ。</div>
    <button class="btn" id="startBtn">ウンコをにぎる</button>
  </div>

  <!-- result -->
  <div class="screen hidden" id="resultScreen">
    <div class="em" id="resEmoji">💩</div>
    <div class="rank" id="resRank">ナイスウンコ！</div>
    <div class="resultDist">きろく<br><b id="resDist">0.0</b> m</div>
    <div class="sub" id="resBest">最高記録 0.0 m</div>
    <button class="btn" id="retryBtn">もう一回なげる</button>
  </div>
</div>

<script>
(function(){
"use strict";

// ---------- canvas setup ----------
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W=0, H=0, DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

// ---------- DOM ----------
const el = {
  hud: document.getElementById('hud'),
  distVal: document.getElementById('distVal'),
  bestVal: document.getElementById('bestVal'),
  hint: document.getElementById('hint'),
  gaugeWrap: document.getElementById('gaugeWrap'),
  gaugeFill: document.getElementById('gaugeFill'),
  rpm: document.getElementById('rpm'),
  shout: document.getElementById('shout'),
  titleScreen: document.getElementById('titleScreen'),
  resultScreen: document.getElementById('resultScreen'),
  startBtn: document.getElementById('startBtn'),
  retryBtn: document.getElementById('retryBtn'),
  resDist: document.getElementById('resDist'),
  resRank: document.getElementById('resRank'),
  resEmoji: document.getElementById('resEmoji'),
  resBest: document.getElementById('resBest'),
  muteBtn: document.getElementById('muteBtn'),
};

// ---------- state ----------
const STATE = { TITLE:0, CHARGE:1, FLY:2, RESULT:3 };
let state = STATE.TITLE;
let best = parseFloat(localStorage.getItem('unkoman_best')||'0')||0;
el.bestVal.textContent = best.toFixed(1);

// charge data
let charging=false;
let spinPower=0;          // 0..1 accumulated
let angVel=0;             // current angular velocity (rad/frame), smoothed
let lastAngle=null;
let lastPointer=null;
let wobble=0;             // elastic wobble phase
const MAX_POWER=1;
const SPIN_GAIN=0.020;    // how fast swirling fills power
const DECAY=0.978;        // power decay when not swirling
let pivot={x:0,y:0};      // hand pivot point (where poop is held)

// flight data
let fly=null;

// effects
let particles=[];
let sparkles=[];
let camShake=0;

// ---------- audio (WebAudio + SpeechSynthesis) ----------
let muted=false;
let actx=null;
function audio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function tone(freq,dur,type,vol,slideTo){
  if(muted) return; const a=audio(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime+dur);
  g.gain.value=vol||0.2; g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+dur);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+dur);
}
function whoosh(){
  if(muted) return; const a=audio(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(), f=a.createBiquadFilter();
  o.type='sawtooth'; f.type='bandpass'; f.frequency.value=900; f.Q.value=0.8;
  o.frequency.setValueAtTime(180,a.currentTime); o.frequency.exponentialRampToValueAtTime(1400,a.currentTime+0.35);
  g.gain.setValueAtTime(0.0001,a.currentTime); g.gain.exponentialRampToValueAtTime(0.35,a.currentTime+0.05);
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.5);
  o.connect(f).connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+0.55);
}
let lastSpinSnd=0;
function spinTick(){
  const now=performance.now();
  if(now-lastSpinSnd>120-spinPower*70){ lastSpinSnd=now; tone(220+spinPower*600,0.06,'triangle',0.06); }
}
function speak(text){
  if(muted) return;
  try{
    if(!('speechSynthesis' in window)) return;
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ja-JP'; u.rate=1.05; u.pitch=1.25; u.volume=1;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
el.muteBtn.addEventListener('click',()=>{
  muted=!muted; el.muteBtn.textContent=muted?'🔇':'🔊';
  if(muted && 'speechSynthesis' in window) speechSynthesis.cancel();
});

// ---------- helpers ----------
function rand(a,b){ return a+Math.random()*(b-a); }
// pseudo-3D ground projection: depth z (0=near/foot .. large=far) -> screen y & scale
const HORIZON = ()=> H*0.40;
function groundY(z){ // z>=0
  const h=HORIZON(); const base=H*0.92;
  return base - (base-h)*(z/(z+40)); // asymptotes to horizon
}
function depthScale(z){ return 40/(z+40); }

// ---------- scene drawing ----------
function drawScene(){
  // sky gradient
  const h=HORIZON();
  let sky=ctx.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#9fd2ff'); sky.addColorStop(1,'#e8f6ff');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,h);
  // sun
  ctx.save(); ctx.globalAlpha=.8; ctx.fillStyle='#fff7d6';
  ctx.beginPath(); ctx.arc(W*0.78,h*0.45,34,0,7); ctx.fill(); ctx.restore();
  // clouds
  ctx.fillStyle='rgba(255,255,255,.85)';
  cloud(W*0.2,h*0.4,1); cloud(W*0.6,h*0.25,0.7); cloud(W*0.9,h*0.6,0.9);

  // ground
  let gr=ctx.createLinearGradient(0,h,0,H);
  gr.addColorStop(0,'#8fd06a'); gr.addColorStop(1,'#4f9a36');
  ctx.fillStyle=gr; ctx.fillRect(0,h,W,H-h);

  // distance lines + markers (every 10m up to far)
  ctx.textAlign='center'; ctx.font='bold 13px sans-serif';
  for(let m=10;m<=120;m+=10){
    const z=m*0.9;
    const y=groundY(z); const s=depthScale(z);
    ctx.strokeStyle='rgba(255,255,255,'+(0.15+0.35*s)+')';
    ctx.lineWidth=Math.max(1,3*s);
    ctx.beginPath(); ctx.moveTo(W*0.5-(W*0.6*s),y); ctx.lineTo(W*0.5+(W*0.6*s),y); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,'+(0.4+0.5*s)+')';
    ctx.fillText(m+'m', W*0.5+(W*0.55*s), y-3);
  }
}
function cloud(x,y,s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.beginPath();
  ctx.arc(0,0,22,0,7); ctx.arc(26,6,18,0,7); ctx.arc(-24,6,16,0,7); ctx.arc(4,-12,16,0,7);
  ctx.fill(); ctx.restore();
}

// draw an elastic, wobbly poop (soft-serve swirl). cx,cy center; r base radius; stretch>1 elongates; rot rotation
function drawPoop(cx,cy,r,stretch,rot,wob){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rot||0);
  ctx.scale(1, stretch||1);
  // shadow under
  // three stacked blobs (soft serve)
  const layers=[
    {y:r*0.95, rx:r*1.0, ry:r*0.7, c:'#7a4a1d'},
    {y:r*0.15, rx:r*0.78, ry:r*0.62, c:'#8a571f'},
    {y:-r*0.55, rx:r*0.55, ry:r*0.5, c:'#9a652a'},
  ];
  for(let i=0;i<layers.length;i++){
    const L=layers[i];
    const w=Math.sin((wob||0)+i)*0.10;
    ctx.fillStyle=L.c;
    ctx.beginPath();
    ctx.ellipse(0,L.y,L.rx*(1+w),L.ry*(1-w),0,0,7);
    ctx.fill();
    // highlight
    ctx.fillStyle='rgba(255,255,255,.18)';
    ctx.beginPath();
    ctx.ellipse(-L.rx*0.3,L.y-L.ry*0.3,L.rx*0.4,L.ry*0.3,0,0,7);
    ctx.fill();
  }
  // pointy tip on top (the 先端 we swing)
  ctx.fillStyle='#a86d2e';
  ctx.beginPath();
  ctx.moveTo(-r*0.32,-r*0.9);
  ctx.quadraticCurveTo(r*0.05+Math.sin((wob||0)*1.3)*r*0.25, -r*1.7, r*0.30,-r*0.9);
  ctx.closePath(); ctx.fill();
  // face
  ctx.fillStyle='#3a230c';
  const eg=r*0.18;
  ctx.beginPath(); ctx.arc(-r*0.28,-r*0.35,eg*0.5,0,7); ctx.arc(r*0.28,-r*0.35,eg*0.5,0,7); ctx.fill();
  ctx.strokeStyle='#3a230c'; ctx.lineWidth=Math.max(2,r*0.06); ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,-r*0.12,r*0.3,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  ctx.restore();
}

// athlete (back view) holding poop near hand pivot
function drawAthlete(){
  const baseX=W*0.5, baseY=H*0.93;
  ctx.save();
  // body (back view) - simple silhouette
  ctx.fillStyle='#2f3a52';
  ctx.beginPath();
  ctx.moveTo(baseX-46,H+10);
  ctx.lineTo(baseX-40,baseY-120);
  ctx.quadraticCurveTo(baseX,baseY-170,baseX+40,baseY-120);
  ctx.lineTo(baseX+46,H+10);
  ctx.closePath(); ctx.fill();
  // head
  ctx.fillStyle='#e8b98f';
  ctx.beginPath(); ctx.arc(baseX,baseY-150,26,0,7); ctx.fill();
  ctx.fillStyle='#2a2118';
  ctx.beginPath(); ctx.arc(baseX,baseY-158,24,Math.PI,2*Math.PI); ctx.fill();
  // arm reaching to pivot
  ctx.strokeStyle='#e8b98f'; ctx.lineWidth=16; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(baseX+30,baseY-120); ctx.lineTo(pivot.x,pivot.y); ctx.stroke();
  ctx.restore();
}

// ---------- charge screen ----------
function startCharge(){
  state=STATE.CHARGE;
  spinPower=0; angVel=0; lastAngle=null; lastPointer=null; charging=false; wobble=0;
  particles.length=0; sparkles.length=0;
  el.titleScreen.classList.add('hidden');
  el.resultScreen.classList.add('hidden');
  el.gaugeWrap.style.display='block';
  el.hint.style.display='block';
  el.distVal.textContent='0.0';
  pivot.x=W*0.5; pivot.y=H*0.62;
  audio(); // unlock audio on user gesture
}

function updateCharge(){
  wobble += 0.15 + angVel*3;
  if(!charging){ angVel*=0.85; spinPower*=DECAY; }
  // gauge UI
  el.gaugeFill.style.width=(spinPower*100).toFixed(0)+'%';
  const rpm=Math.round(Math.abs(angVel)*60/(2*Math.PI)*60); // rough
  el.rpm.textContent=rpm+' RPM';
  if(spinPower>0.06) el.hint.style.display='none';

  // emit swirl sparkles around pivot while spinning hard
  if(charging && Math.abs(angVel)>0.05){
    spinTick();
    for(let i=0;i<2;i++){
      const a=rand(0,7), d=rand(20,60)*(0.5+spinPower);
      sparkles.push({x:pivot.x+Math.cos(a)*d, y:pivot.y+Math.sin(a)*d, vx:Math.cos(a)*2, vy:Math.sin(a)*2,
        life:1, c: spinPower>0.7?'#ffce3d':'#fff2c0', sz:rand(2,5)+spinPower*4});
    }
  }
}

function drawCharge(){
  drawScene();
  drawAthlete();
  // ground shadow of poop
  ctx.save(); ctx.globalAlpha=.25; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(pivot.x,H*0.9,60,16,0,0,7); ctx.fill(); ctx.restore();

  // sparkles
  drawSparkles();

  // motion swirl ring indicator
  const swirlR=70+spinPower*30;
  ctx.save(); ctx.translate(pivot.x,pivot.y);
  ctx.rotate(wobble*0.4);
  ctx.strokeStyle='rgba(255,210,80,'+(0.25+spinPower*0.5)+')';
  ctx.lineWidth=4+spinPower*8;
  for(let k=0;k<3;k++){
    ctx.beginPath();
    ctx.arc(0,0,swirlR-k*6, k*2.0, k*2.0+1.6+spinPower*2);
    ctx.stroke();
  }
  ctx.restore();

  // the poop, stretched by spin (弾力), rotating
  const stretch=1+spinPower*0.55+Math.sin(wobble)*0.05*(0.3+spinPower);
  const r=58+spinPower*10;
  drawPoop(pivot.x,pivot.y,r,stretch,Math.sin(wobble*0.5)*0.15*(1+spinPower), wobble);

  // "MAX!" flash
  if(spinPower>=0.985){
    ctx.save(); ctx.globalAlpha=0.5+0.5*Math.sin(performance.now()/60);
    ctx.fillStyle='#ff3d3d'; ctx.font='900 40px sans-serif'; ctx.textAlign='center';
    ctx.fillText('MAX!!', pivot.x, pivot.y-r*2.2); ctx.restore();
  }
}

// ---------- pointer / swirl input ----------
function angAt(x,y){ return Math.atan2(y-pivot.y, x-pivot.x); }
function onDown(x,y){
  if(state!==STATE.CHARGE) return;
  charging=true; lastAngle=angAt(x,y); lastPointer={x,y};
}
function onMove(x,y){
  if(state!==STATE.CHARGE||!charging) return;
  const a=angAt(x,y);
  if(lastAngle!==null){
    let d=a-lastAngle;
    while(d>Math.PI) d-=2*Math.PI;
    while(d<-Math.PI) d+=2*Math.PI;
    // accumulate by absolute swirl; reward consistent rotation & fast motion
    const moveDist = lastPointer? Math.hypot(x-lastPointer.x,y-lastPointer.y):0;
    angVel = angVel*0.6 + d*0.4;
    const gain = Math.abs(d) * (0.6+Math.min(moveDist/40,1.2)) * SPIN_GAIN * 6;
    spinPower = Math.min(MAX_POWER, spinPower + gain);
  }
  lastAngle=a; lastPointer={x,y};
}
function onUp(){
  if(state===STATE.CHARGE && charging){
    charging=false;
    if(spinPower>0.04) launch();
  }
}
// unified pointer handlers
function pos(e){
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX, y:t.clientY};
}
cv.addEventListener('touchstart',e=>{e.preventDefault(); const p=pos(e); onDown(p.x,p.y);},{passive:false});
cv.addEventListener('touchmove', e=>{e.preventDefault(); const p=pos(e); onMove(p.x,p.y);},{passive:false});
cv.addEventListener('touchend',  e=>{e.preventDefault(); onUp();},{passive:false});
cv.addEventListener('mousedown', e=>{const p=pos(e); onDown(p.x,p.y);});
cv.addEventListener('mousemove', e=>{const p=pos(e); onMove(p.x,p.y);});
window.addEventListener('mouseup', onUp);

// ---------- launch / flight ----------
function launch(){
  state=STATE.FLY;
  el.gaugeWrap.style.display='none';
  el.hint.style.display='none';
  whoosh();
  speak('それー！');
  camShake=10;
  // distance scales with power (with a little luck); add spin bonus
  const power=spinPower;
  const baseDist = 8 + Math.pow(power,1.35)*112;       // up to ~120m
  const luck = rand(0.92,1.10);
  const distance = Math.max(1, baseDist*luck);
  fly={
    t:0,
    distance,                // final ground distance (m)
    z:0,                     // current depth used for projection
    height:0,                // arc height (screen px add)
    rot:0, spin: 0.25+power*0.7,
    landed:false,
    startScreen:{x:pivot.x,y:pivot.y},
    peak: 120+power*180,     // arc peak in px
    flightFrames: 60+power*70,
    trail:[],
  };
  // launch burst
  for(let i=0;i<24;i++){
    const a=rand(-2.4,-0.7), sp=rand(3,9);
    particles.push({x:pivot.x,y:pivot.y,vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-3, life:1, c:'#caa15a', sz:rand(3,7)});
  }
}

function updateFly(){
  const f=fly; f.t++;
  const p=Math.min(1, f.t/f.flightFrames);
  // depth progresses (ease-out so it slows visually far away)
  f.z = (f.distance*0.9) * (1-Math.pow(1-p,1.8));
  // parabolic arc
  f.height = Math.sin(p*Math.PI)*f.peak;
  f.rot += f.spin;
  // trail
  const proj=projFly();
  f.trail.push({x:proj.x,y:proj.y,s:proj.s}); if(f.trail.length>14) f.trail.shift();
  // flight whoosh particles
  if(f.t%2===0){
    particles.push({x:proj.x+rand(-6,6),y:proj.y+rand(-6,6),vx:rand(-1,1),vy:rand(-1,1),life:1,c:'#e9d6a0',sz:rand(2,5)*proj.s});
  }
  if(p>=1 && !f.landed){
    f.landed=true; land();
  }
}
function projFly(){
  const f=fly;
  const gy=groundY(f.z);
  const s=depthScale(f.z);
  const x=W*0.5 + (f.startScreen.x-W*0.5)*s; // converge toward center line
  const y=gy - f.height*s*1.4;
  return {x,y,s};
}
function drawFly(){
  drawScene();
  drawAthlete();
  const f=fly; const proj=projFly();
  // trail (motion streak) — 飛んでいる描写
  for(let i=0;i<f.trail.length;i++){
    const t=f.trail[i]; const a=i/f.trail.length;
    ctx.save(); ctx.globalAlpha=a*0.5;
    ctx.fillStyle='#c9a25c';
    ctx.beginPath(); ctx.ellipse(t.x,t.y,40*t.s*a,18*t.s*a,0,0,7); ctx.fill();
    ctx.restore();
  }
  // speed lines behind poop
  ctx.save(); ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=2;
  for(let k=0;k<5;k++){
    const off=(k-2)*10*proj.s;
    ctx.beginPath(); ctx.moveTo(proj.x-60*proj.s, proj.y+off); ctx.lineTo(proj.x-20*proj.s, proj.y+off); ctx.stroke();
  }
  ctx.restore();
  drawParticles();
  // flying poop (spinning)
  drawPoop(proj.x, proj.y, 56*proj.s, 1+Math.sin(f.rot)*0.12, f.rot, f.rot*2);
  // live distance readout
  el.distVal.textContent=(f.z/0.9).toFixed(1);
}

function land(){
  const f=fly;
  const d=f.distance;
  camShake=14;
  // landing splat particles
  const proj=projFly();
  for(let i=0;i<26;i++){
    const a=rand(0,7), sp=rand(1,5)*proj.s*1.5+1;
    particles.push({x:proj.x,y:proj.y,vx:Math.cos(a)*sp,vy:-Math.abs(Math.sin(a))*sp-1,life:1,c:'#7a4a1d',sz:rand(2,6)});
  }
  tone(90,0.3,'square',0.25,40);
  el.distVal.textContent=d.toFixed(1);
  // rank + shout
  const r=rankFor(d);
  el.shout.textContent=r.shout;
  el.shout.classList.remove('go'); void el.shout.offsetWidth; el.shout.classList.add('go');
  speak(r.voice);
  // settle then result
  setTimeout(()=>showResult(d,r), 1100);
}

function rankFor(d){
  if(d>=110) return {shout:'神ウンコ！！！', voice:'かみウンコー！', rank:'👑 神ウンコ', emoji:'👑'};
  if(d>=85)  return {shout:'スーパーウンコ！！', voice:'スーパーウンコ！', rank:'🌟 スーパーウンコ', emoji:'🌟'};
  if(d>=55)  return {shout:'ナイスウンコ！！', voice:'ナイスウンコ！', rank:'✨ ナイスウンコ', emoji:'✨'};
  if(d>=30)  return {shout:'いいウンコ！', voice:'いいウンコ！', rank:'👍 いいウンコ', emoji:'👍'};
  return {shout:'ざんねんウンコ…', voice:'ざんねん', rank:'💧 ざんねんウンコ', emoji:'💧'};
}

function showResult(d,r){
  state=STATE.RESULT;
  if(d>best){ best=d; localStorage.setItem('unkoman_best',best.toFixed(2)); }
  el.bestVal.textContent=best.toFixed(1);
  el.resDist.textContent=d.toFixed(1);
  el.resRank.textContent=r.rank + (d>=best-0.001 && d>0 ? '　🆕最高記録！' : '');
  el.resEmoji.textContent=r.emoji;
  el.resBest.textContent='最高記録 '+best.toFixed(1)+' m';
  el.resultScreen.classList.remove('hidden');
}

// ---------- particles / sparkles ----------
function drawParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.35; p.life-=0.025;
    if(p.life<=0){ particles.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz,0,7); ctx.fill(); ctx.restore();
  }
}
function drawSparkles(){
  for(let i=sparkles.length-1;i>=0;i--){
    const s=sparkles[i];
    s.x+=s.vx; s.y+=s.vy; s.life-=0.04;
    if(s.life<=0){ sparkles.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha=Math.max(0,s.life); ctx.fillStyle=s.c;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.sz,0,7); ctx.fill(); ctx.restore();
  }
}

// ---------- main loop ----------
function frame(){
  ctx.save();
  if(camShake>0){
    ctx.translate(rand(-camShake,camShake),rand(-camShake,camShake));
    camShake*=0.88; if(camShake<0.4) camShake=0;
  }
  if(state===STATE.TITLE){ drawScene(); drawAthlete(); }
  else if(state===STATE.CHARGE){ updateCharge(); drawCharge(); }
  else if(state===STATE.FLY){ updateFly(); drawFly(); }
  else if(state===STATE.RESULT){ drawScene(); drawAthlete(); drawParticles(); }
  ctx.restore();
  requestAnimationFrame(frame);
}
frame();

// ---------- buttons ----------
el.startBtn.addEventListener('click', startCharge);
el.retryBtn.addEventListener('click', startCharge);

})();
</script>
