<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#7a4a1d" />
<title>うんこマン -UNKOMAN-</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0e1116;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:none; }
  #game { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }

  .ui { position:absolute; pointer-events:none; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.55); }

  /* HUD */
  #hud { top:env(safe-area-inset-top,0); left:0; right:0; padding:16px 18px 0;
    display:flex; justify-content:space-between; align-items:flex-start; font-weight:800; }
  .card { background:rgba(10,14,22,.32); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.18); border-radius:14px; padding:8px 14px; }
  #dist { font-size:13px; letter-spacing:1px; opacity:.95; }
  #dist b { display:block; font-size:32px; line-height:1.05; color:#fff; }
  #dist b small { font-size:15px; opacity:.8; }
  #best { font-size:12px; text-align:right; opacity:.95; }
  #best b { display:block; font-size:20px; color:#ffe36e; }

  /* power gauge */
  #gaugeWrap { left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0)); transform:translateX(-50%);
    width:min(80vw,440px); }
  #gaugeLabel { text-align:center; color:#ffe9b0; font-weight:900; font-size:13px; letter-spacing:2px; margin-bottom:6px; }
  #gauge { position:relative; height:20px; border-radius:14px; background:rgba(0,0,0,.42);
    border:2px solid rgba(255,255,255,.4); overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,.4); }
  #gaugeFill { height:100%; width:0%; border-radius:12px;
    background:linear-gradient(90deg,#7be36e,#ffe36e 45%,#ff8a3d 75%,#ff3d3d); transition:width .04s linear; }
  #gauge .maxzone { position:absolute; top:0; bottom:0; right:0; width:12%;
    background:repeating-linear-gradient(45deg,rgba(255,255,255,.25) 0 6px,rgba(255,255,255,0) 6px 12px); }
  #rpm { text-align:center; color:#fff; font-weight:800; font-size:12px; margin-top:5px; opacity:.85; letter-spacing:1px; }

  #shout { left:0; right:0; top:30%; text-align:center; font-weight:900; font-size:clamp(40px,13vw,72px);
    color:#fff; -webkit-text-stroke:3px #b5450a; opacity:0; transform:scale(.4) rotate(-6deg); }
  #shout.go { animation:pop 1.25s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes pop { 0%{opacity:0;transform:scale(.3) rotate(-10deg);} 16%{opacity:1;transform:scale(1.18) rotate(4deg);}
    32%{transform:scale(1) rotate(-2deg);} 82%{opacity:1;transform:scale(1) rotate(0);} 100%{opacity:0;transform:scale(1.06);} }

  #hint { left:50%; top:44%; transform:translate(-50%,-50%); text-align:center;
    color:#fff; font-weight:800; font-size:18px; line-height:1.8; opacity:.97; }
  #hint .big { font-size:27px; color:#ffd23d; }
  #hint .swirl { font-size:54px; display:block; animation:spin 1.5s linear infinite; }
  @keyframes spin { from{transform:rotate(0);} to{transform:rotate(360deg);} }

  .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:16px; padding:30px; z-index:5;
    background:radial-gradient(130% 90% at 50% 25%, rgba(40,60,90,.25), rgba(6,9,14,.85)); }
  .screen.hidden { display:none; }
  .screen h1 { color:#ffd23d; font-size:clamp(40px,12vw,58px); font-weight:900; -webkit-text-stroke:2px #6b3a10;
    text-shadow:0 6px 0 #6b3a10, 0 12px 22px rgba(0,0,0,.5); line-height:1.05; }
  .screen .sub { color:#fff; font-size:15px; opacity:.92; line-height:1.85; }
  .screen .em { font-size:64px; filter:drop-shadow(0 8px 14px rgba(0,0,0,.5)); animation:bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-3deg);} 50%{transform:translateY(-12px) rotate(3deg);} }
  .screen .resultDist b { color:#ffe36e; font-size:60px; font-weight:900; }
  .screen .resultDist { color:#fff; font-weight:900; font-size:14px; }
  .btn { pointer-events:auto; cursor:pointer; border:none; border-radius:999px;
    padding:16px 44px; font-size:22px; font-weight:900; color:#5a2d05;
    background:linear-gradient(180deg,#ffe06a,#ffb02e); box-shadow:0 6px 0 #b5701a, 0 12px 22px rgba(0,0,0,.45);
    transition:transform .08s, box-shadow .08s; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #b5701a, 0 6px 12px rgba(0,0,0,.45); }
  .rank { font-size:30px; font-weight:900; color:#fff; }
  .newrec { display:inline-block; margin-left:8px; color:#ff5a3d; font-size:18px; animation:flash 0.6s steps(2) infinite; }
  @keyframes flash { 50%{opacity:.3;} }
  .muteBtn { position:absolute; top:calc(16px + env(safe-area-inset-top,0)); right:14px; pointer-events:auto; cursor:pointer;
    background:rgba(10,14,22,.4); border:1px solid rgba(255,255,255,.35); color:#fff; border-radius:999px;
    width:44px; height:44px; font-size:18px; z-index:6; }
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <div id="hud" class="ui">
    <div class="card" id="dist">きょり<b><span id="distVal">0.0</span><small> m</small></b></div>
    <div class="card" id="best">ベスト<b id="bestVal">0.0</b><span style="font-size:11px;opacity:.7">m</span></div>
  </div>

  <div id="hint" class="ui">
    <span class="swirl">🌀</span>
    ウンコを<span class="big">グリグリ</span>回して<br>いきおいをためろ！
  </div>

  <div id="gaugeWrap" class="ui">
    <div id="gaugeLabel">いきおい</div>
    <div id="gauge"><div id="gaugeFill"></div><div class="maxzone"></div></div>
    <div id="rpm">0 RPM</div>
  </div>

  <div id="shout" class="ui">ナイスウンコ！！</div>

  <button class="muteBtn" id="muteBtn" title="サウンド">🔊</button>

  <div class="screen" id="titleScreen">
    <div class="em">💩</div>
    <h1>うんこマン<br>UNKOMAN</h1>
    <div class="sub">指でウンコの先っぽを<b>グリグリ回転</b>させて<br>いきおいをため、はなして遠投！<br>どこまで飛ばせるか勝負だ。</div>
    <button class="btn" id="startBtn">ウンコをにぎる</button>
  </div>

  <div class="screen hidden" id="resultScreen">
    <div class="em" id="resEmoji">💩</div>
    <div class="rank" id="resRank">ナイスウンコ！</div>
    <div class="resultDist">きろく<br><b id="resDist">0.0</b> m</div>
    <div class="sub" id="resBest">ベスト 0.0 m</div>
    <button class="btn" id="retryBtn">もう一回なげる</button>
  </div>
</div>

<script>
(function(){
"use strict";

// ---------- canvas ----------
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W=0, H=0, DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

// ---------- DOM ----------
const el = {
  distVal:document.getElementById('distVal'), bestVal:document.getElementById('bestVal'),
  hint:document.getElementById('hint'), gaugeWrap:document.getElementById('gaugeWrap'),
  gaugeFill:document.getElementById('gaugeFill'), rpm:document.getElementById('rpm'),
  shout:document.getElementById('shout'),
  titleScreen:document.getElementById('titleScreen'), resultScreen:document.getElementById('resultScreen'),
  startBtn:document.getElementById('startBtn'), retryBtn:document.getElementById('retryBtn'),
  resDist:document.getElementById('resDist'), resRank:document.getElementById('resRank'),
  resEmoji:document.getElementById('resEmoji'), resBest:document.getElementById('resBest'),
  muteBtn:document.getElementById('muteBtn'),
};

// ---------- state ----------
const STATE = { TITLE:0, CHARGE:1, FLY:2, RESULT:3 };
let state = STATE.TITLE;
let best = parseFloat(localStorage.getItem('unkoman_best')||'0')||0;
el.bestVal.textContent = best.toFixed(1);

let charging=false, spinPower=0, angVel=0, lastAngle=null, lastPointer=null, wobble=0;
const MAX_POWER=1, SPIN_GAIN=0.020, DECAY=0.978;
let pivot={x:0,y:0};
let fly=null;
let particles=[], sparkles=[], confetti=[], decals=[];
let camShake=0, flash=0, slowmo=1;
const cam={y:0, tgt:0};
let time=0;

// ---------- audio ----------
let muted=false, actx=null, noiseBuf=null, crowdGain=null;
function audio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function ensureNoise(){
  const a=audio(); if(!a||noiseBuf) return;
  noiseBuf=a.createBuffer(1, a.sampleRate*2, a.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
}
function tone(freq,dur,type,vol,slideTo){
  if(muted) return; const a=audio(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo), a.currentTime+dur);
  g.gain.value=vol||0.2; g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+dur);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+dur);
}
function whoosh(){
  if(muted) return; const a=audio(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(), f=a.createBiquadFilter();
  o.type='sawtooth'; f.type='bandpass'; f.frequency.value=900; f.Q.value=0.7;
  o.frequency.setValueAtTime(160,a.currentTime); o.frequency.exponentialRampToValueAtTime(1500,a.currentTime+0.4);
  g.gain.setValueAtTime(0.0001,a.currentTime); g.gain.exponentialRampToValueAtTime(0.4,a.currentTime+0.05);
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.55);
  o.connect(f).connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+0.6);
}
function startCrowd(){
  const a=audio(); if(!a||!noiseBuf||crowdGain) return;
  const src=a.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=500;
  crowdGain=a.createGain(); crowdGain.gain.value=0.0;
  src.connect(f).connect(crowdGain).connect(a.destination); src.start();
}
function setCrowd(v){ if(crowdGain && !muted){ crowdGain.gain.setTargetAtTime(v,audio().currentTime,0.15); } }
function cheer(intensity){
  if(muted) return; const a=audio(); if(!a||!noiseBuf) return;
  const src=a.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1600; f.Q.value=0.5;
  const g=a.createGain(); g.gain.setValueAtTime(0.0001,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.25*intensity,a.currentTime+0.12);
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+1.3);
  src.connect(f).connect(g).connect(a.destination); src.start(); src.stop(a.currentTime+1.4);
  // whistles
  for(let i=0;i<intensity*3;i++) setTimeout(()=>tone(1800+Math.random()*900,0.12,'square',0.04),i*90+Math.random()*200);
}
let lastSpinSnd=0;
function spinTick(){
  const now=performance.now();
  if(now-lastSpinSnd>120-spinPower*72){ lastSpinSnd=now; tone(220+spinPower*640,0.05,'triangle',0.05); }
}
function speak(text){
  if(muted) return;
  try{ if(!('speechSynthesis' in window)) return;
    const u=new SpeechSynthesisUtterance(text); u.lang='ja-JP'; u.rate=1.05; u.pitch=1.3; u.volume=1;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
el.muteBtn.addEventListener('click',()=>{
  muted=!muted; el.muteBtn.textContent=muted?'🔇':'🔊';
  if(muted){ if('speechSynthesis' in window) speechSynthesis.cancel(); if(crowdGain) crowdGain.gain.value=0; }
});

// ---------- helpers ----------
function rand(a,b){ return a+Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
const HORIZON = ()=> H*0.42;
function groundY(z){ const h=HORIZON(); const base=H*0.95; return base-(base-h)*(z/(z+42)); }
function depthScale(z){ return 42/(z+42); }
function mToZ(m){ return m*0.9; }
function zToM(z){ return z/0.9; }

// ---------- scene ----------
let clouds=[{x:0.15,y:0.30,s:1.0,sp:0.004},{x:0.55,y:0.18,s:0.7,sp:0.006},{x:0.85,y:0.40,s:0.9,sp:0.003}];
function drawSky(){
  const h=HORIZON();
  let sky=ctx.createLinearGradient(0,-H,0,h);
  sky.addColorStop(0,'#3f7fd6'); sky.addColorStop(0.6,'#8fc4f2'); sky.addColorStop(1,'#dff1ff');
  ctx.fillStyle=sky; ctx.fillRect(-50,-H,W+100,h+H);
  // sun glow
  ctx.save();
  const sx=W*0.76, sy=h*0.42;
  const gl=ctx.createRadialGradient(sx,sy,4,sx,sy,150);
  gl.addColorStop(0,'rgba(255,250,220,.95)'); gl.addColorStop(1,'rgba(255,250,220,0)');
  ctx.fillStyle=gl; ctx.fillRect(sx-150,sy-150,300,300);
  ctx.fillStyle='#fff8d8'; ctx.beginPath(); ctx.arc(sx,sy,30,0,7); ctx.fill();
  ctx.restore();
  // clouds
  for(const c of clouds){
    c.x+=c.sp*0.01; if(c.x>1.25) c.x=-0.25;
    cloud(c.x*W, c.y*h, c.s);
  }
}
function cloud(x,y,s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle='rgba(255,255,255,.92)';
  ctx.beginPath(); ctx.arc(0,0,24,0,7); ctx.arc(28,7,19,0,7); ctx.arc(-26,7,17,0,7); ctx.arc(5,-13,17,0,7); ctx.fill();
  ctx.fillStyle='rgba(210,228,245,.7)';
  ctx.beginPath(); ctx.ellipse(0,14,46,8,0,0,7); ctx.fill();
  ctx.restore();
}
function drawStadium(){
  const h=HORIZON();
  // far stands band
  ctx.fillStyle='#5a6472'; ctx.fillRect(-50,h-46,W+100,46);
  ctx.fillStyle='#48505c'; ctx.fillRect(-50,h-46,W+100,10);
  // crowd dots
  for(let i=0;i<W;i+=7){
    const r=((i*131)%7); const cy=h-40+ (i%5)*7;
    ctx.fillStyle=['#e7c9a0','#d98','#cdd','#fff','#f6c84c','#c66'][(i*7)%6];
    ctx.fillRect(i+ (r-3), cy, 4,4);
  }
  // roof rim
  ctx.fillStyle='#2f3744'; ctx.fillRect(-50,h-50,W+100,5);
}
function drawField(){
  const h=HORIZON();
  // base green
  let gr=ctx.createLinearGradient(0,h,0,H+H*0.3);
  gr.addColorStop(0,'#79c25b'); gr.addColorStop(1,'#3f8a2c');
  ctx.fillStyle=gr; ctx.fillRect(-50,h,W+100,H*1.4);
  // mowing stripes (perspective trapezoids)
  let prevY=h, idx=0;
  for(let m=130;m>=0;m-=5){
    const y=groundY(mToZ(m));
    if(idx%2===0){ ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fillRect(-50,y,W+100,prevY-y+1); }
    prevY=y; idx++;
  }
  // yard lines + markers every 10m
  ctx.textAlign='center'; ctx.font='900 13px sans-serif';
  for(let m=10;m<=130;m+=10){
    const z=mToZ(m), y=groundY(z), s=depthScale(z);
    ctx.strokeStyle='rgba(255,255,255,'+(0.12+0.5*s)+')'; ctx.lineWidth=Math.max(1,3*s);
    ctx.beginPath(); ctx.moveTo(-50,y); ctx.lineTo(W+50,y); ctx.stroke();
    const lab=(0.45+0.55*s);
    ctx.fillStyle='rgba(255,255,255,'+lab+')';
    ctx.fillText(m+'m', W*0.86, y-3*s-2);
    ctx.fillText(m+'m', W*0.14, y-3*s-2);
  }
}
function drawScene(){ drawSky(); drawStadium(); drawField(); }

// ---------- poop ----------
function drawPoop(cx,cy,r,stretch,rot,wob,spinBlur){
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot||0); ctx.scale(1, stretch||1);
  // motion-blur ghosts when spinning fast
  if(spinBlur>0.15){
    ctx.save(); ctx.globalAlpha=0.18*spinBlur;
    for(let k=1;k<=2;k++){ ctx.rotate(0.18*spinBlur); poopBody(r,wob); }
    ctx.restore();
  }
  poopBody(r,wob);
  ctx.restore();
}
function poopBody(r,wob){
  const layers=[
    {y:r*0.95, rx:r*1.02, ry:r*0.72, c1:'#9a652a', c2:'#6e3f16'},
    {y:r*0.12, rx:r*0.80, ry:r*0.62, c1:'#a8732f', c2:'#7c4a1a'},
    {y:-r*0.58, rx:r*0.56, ry:r*0.50, c1:'#b67f37', c2:'#8a571f'},
  ];
  for(let i=0;i<layers.length;i++){
    const L=layers[i], w=Math.sin((wob||0)+i)*0.10;
    const g=ctx.createLinearGradient(0,L.y-L.ry,0,L.y+L.ry);
    g.addColorStop(0,L.c1); g.addColorStop(1,L.c2);
    ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,L.y,L.rx*(1+w),L.ry*(1-w),0,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.22)';
    ctx.beginPath(); ctx.ellipse(-L.rx*0.32,L.y-L.ry*0.34,L.rx*0.42,L.ry*0.28,0,0,7); ctx.fill();
  }
  // glossy tip
  const tg=ctx.createLinearGradient(0,-r*1.7,0,-r*0.9);
  tg.addColorStop(0,'#c89149'); tg.addColorStop(1,'#9a652a');
  ctx.fillStyle=tg; ctx.beginPath();
  ctx.moveTo(-r*0.30,-r*0.92);
  ctx.quadraticCurveTo(r*0.05+Math.sin((wob||0)*1.3)*r*0.28, -r*1.78, r*0.30,-r*0.92);
  ctx.closePath(); ctx.fill();
  // face
  ctx.fillStyle='#2f1c0a';
  ctx.beginPath(); ctx.arc(-r*0.28,-r*0.35,r*0.10,0,7); ctx.arc(r*0.28,-r*0.35,r*0.10,0,7); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-r*0.31,-r*0.39,r*0.035,0,7); ctx.arc(r*0.25,-r*0.39,r*0.035,0,7); ctx.fill();
  ctx.strokeStyle='#2f1c0a'; ctx.lineWidth=Math.max(2,r*0.06); ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,-r*0.10,r*0.30,0.12*Math.PI,0.88*Math.PI); ctx.stroke();
}

// ---------- athlete ----------
function drawAthlete(armX,armY,lean){
  const baseX=W*0.5, baseY=H*0.97;
  ctx.save();
  ctx.translate(baseX,baseY); ctx.rotate((lean||0)*0.16); ctx.translate(-baseX,-baseY);
  // legs
  ctx.strokeStyle='#22304a'; ctx.lineWidth=20; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(baseX-18,baseY); ctx.lineTo(baseX-26,baseY-90); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(baseX+24,baseY); ctx.lineTo(baseX+18,baseY-90); ctx.stroke();
  // torso
  let tg=ctx.createLinearGradient(baseX-50,0,baseX+50,0);
  tg.addColorStop(0,'#3a4763'); tg.addColorStop(1,'#28324a');
  ctx.fillStyle=tg;
  ctx.beginPath();
  ctx.moveTo(baseX-44,baseY-80);
  ctx.quadraticCurveTo(baseX,baseY-180,baseX+44,baseY-80);
  ctx.lineTo(baseX+30,baseY-86); ctx.lineTo(baseX-30,baseY-86);
  ctx.closePath(); ctx.fill();
  // number
  ctx.fillStyle='rgba(255,255,255,.85)'; ctx.font='900 26px sans-serif'; ctx.textAlign='center';
  ctx.fillText('💩', baseX, baseY-118);
  // head
  ctx.fillStyle='#e8b98f'; ctx.beginPath(); ctx.arc(baseX,baseY-158,25,0,7); ctx.fill();
  ctx.fillStyle='#241a12'; ctx.beginPath(); ctx.arc(baseX,baseY-166,24,Math.PI,2*Math.PI); ctx.fill();
  // arm to (armX,armY)
  ctx.strokeStyle='#e8b98f'; ctx.lineWidth=15; ctx.lineCap='round';
  const sX=baseX+30, sY=baseY-128;
  const eX=(sX+armX)/2 + (armY-sY)*0.12, eY=(sY+armY)/2;
  ctx.beginPath(); ctx.moveTo(sX,sY); ctx.quadraticCurveTo(eX,eY,armX,armY); ctx.stroke();
  ctx.restore();
}

// ---------- charge ----------
function startCharge(){
  state=STATE.CHARGE;
  spinPower=0; angVel=0; lastAngle=null; lastPointer=null; charging=false; wobble=0;
  particles.length=0; sparkles.length=0; confetti.length=0; decals.length=0;
  cam.y=0; cam.tgt=0; flash=0; slowmo=1;
  el.titleScreen.classList.add('hidden'); el.resultScreen.classList.add('hidden');
  el.gaugeWrap.style.display='block'; el.hint.style.display='block'; el.distVal.textContent='0.0';
  pivot.x=W*0.5; pivot.y=H*0.60;
  audio(); ensureNoise(); startCrowd();
}
function updateCharge(){
  wobble += 0.15 + angVel*3;
  if(!charging){ angVel*=0.85; spinPower*=DECAY; }
  el.gaugeFill.style.width=(spinPower*100).toFixed(0)+'%';
  el.rpm.textContent=Math.round(Math.abs(angVel)*572)+' RPM';
  if(spinPower>0.06) el.hint.style.display='none';
  setCrowd(0.02+spinPower*0.10);
  if(charging && Math.abs(angVel)>0.05){
    spinTick();
    const n=1+Math.round(spinPower*2);
    for(let i=0;i<n;i++){
      const a=rand(0,7), d=rand(24,64)*(0.5+spinPower);
      sparkles.push({x:pivot.x+Math.cos(a)*d, y:pivot.y+Math.sin(a)*d, vx:Math.cos(a)*2.4, vy:Math.sin(a)*2.4,
        life:1, c: spinPower>0.7?'#ffce3d':'#fff2c0', sz:rand(2,5)+spinPower*4});
    }
  }
}
function drawCharge(){
  drawScene();
  drawAthlete(pivot.x,pivot.y, 0);
  // ground shadow
  ctx.save(); ctx.globalAlpha=.25; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(pivot.x,H*0.9,64,16,0,0,7); ctx.fill(); ctx.restore();
  // charging aura
  if(spinPower>0.02){
    ctx.save(); const ar=80+spinPower*60;
    const ag=ctx.createRadialGradient(pivot.x,pivot.y,10,pivot.x,pivot.y,ar);
    ag.addColorStop(0,'rgba(255,210,90,'+(0.25*spinPower)+')'); ag.addColorStop(1,'rgba(255,120,40,0)');
    ctx.fillStyle=ag; ctx.beginPath(); ctx.arc(pivot.x,pivot.y,ar,0,7); ctx.fill(); ctx.restore();
  }
  drawSparkles();
  // swirl rings
  ctx.save(); ctx.translate(pivot.x,pivot.y); ctx.rotate(wobble*0.4);
  ctx.strokeStyle='rgba(255,210,80,'+(0.25+spinPower*0.5)+')'; ctx.lineWidth=4+spinPower*8;
  const swirlR=72+spinPower*30;
  for(let k=0;k<3;k++){ ctx.beginPath(); ctx.arc(0,0,swirlR-k*6,k*2.0,k*2.0+1.6+spinPower*2); ctx.stroke(); }
  ctx.restore();
  // poop
  const stretch=1+spinPower*0.55+Math.sin(wobble)*0.05*(0.3+spinPower);
  const r=58+spinPower*10;
  drawPoop(pivot.x,pivot.y,r,stretch,Math.sin(wobble*0.5)*0.15*(1+spinPower), wobble, spinPower);
  if(spinPower>=0.985){
    ctx.save(); ctx.globalAlpha=0.55+0.45*Math.sin(performance.now()/55);
    ctx.fillStyle='#ff3d3d'; ctx.font='900 42px sans-serif'; ctx.textAlign='center';
    ctx.fillText('MAX!!', pivot.x, pivot.y-r*2.3); ctx.restore();
  }
}

// ---------- input ----------
function angAt(x,y){ return Math.atan2(y-pivot.y, x-pivot.x); }
function onDown(x,y){ if(state!==STATE.CHARGE) return; charging=true; lastAngle=angAt(x,y); lastPointer={x,y}; }
function onMove(x,y){
  if(state!==STATE.CHARGE||!charging) return;
  const a=angAt(x,y);
  if(lastAngle!==null){
    let d=a-lastAngle; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
    const moveDist=lastPointer?Math.hypot(x-lastPointer.x,y-lastPointer.y):0;
    angVel=angVel*0.6+d*0.4;
    const gain=Math.abs(d)*(0.6+Math.min(moveDist/40,1.2))*SPIN_GAIN*6;
    spinPower=Math.min(MAX_POWER,spinPower+gain);
  }
  lastAngle=a; lastPointer={x,y};
}
function onUp(){ if(state===STATE.CHARGE&&charging){ charging=false; if(spinPower>0.04) launch(); } }
function pos(e){ const t=e.touches?e.touches[0]:e; return {x:t.clientX,y:t.clientY}; }
cv.addEventListener('touchstart',e=>{e.preventDefault();const p=pos(e);onDown(p.x,p.y);},{passive:false});
cv.addEventListener('touchmove', e=>{e.preventDefault();const p=pos(e);onMove(p.x,p.y);},{passive:false});
cv.addEventListener('touchend',  e=>{e.preventDefault();onUp();},{passive:false});
cv.addEventListener('mousedown', e=>{const p=pos(e);onDown(p.x,p.y);});
cv.addEventListener('mousemove', e=>{const p=pos(e);onMove(p.x,p.y);});
window.addEventListener('mouseup', onUp);

// ---------- launch / flight ----------
function launch(){
  state=STATE.FLY; el.gaugeWrap.style.display='none'; el.hint.style.display='none';
  whoosh(); speak('それー！'); camShake=12; flash=0.7; slowmo=0.35;
  setCrowd(0.04);
  const power=spinPower;
  const baseDist=8+Math.pow(power,1.35)*120;
  const distance=Math.max(1, baseDist*rand(0.94,1.10));
  fly={ t:0, distance, z:0, height:0, rot:0, spin:0.25+power*0.75, landed:false,
        startScreen:{x:pivot.x,y:pivot.y}, peak:130+power*200, flightFrames:64+power*72, trail:[] };
  for(let i=0;i<28;i++){ const a=rand(-2.4,-0.7), sp=rand(3,10);
    particles.push({x:pivot.x,y:pivot.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,life:1,c:'#caa15a',sz:rand(3,7)}); }
}
function projFly(){
  const f=fly; const gy=groundY(f.z); const s=depthScale(f.z);
  const x=W*0.5+(f.startScreen.x-W*0.5)*s;
  const y=gy-f.height*s*1.5;
  return {x,y,s};
}
function updateFly(){
  const f=fly; f.t+=slowmo;
  const p=Math.min(1,f.t/f.flightFrames);
  f.z=(mToZ(f.distance))*(1-Math.pow(1-p,1.85));
  f.height=Math.sin(p*Math.PI)*f.peak;
  f.rot+=f.spin*slowmo;
  const proj=projFly();
  f.trail.push({x:proj.x,y:proj.y,s:proj.s}); if(f.trail.length>16) f.trail.shift();
  if(f.t%2<1){ particles.push({x:proj.x+rand(-6,6),y:proj.y+rand(-6,6),vx:rand(-1,1),vy:rand(-1,1),life:1,c:'#e9d6a0',sz:rand(2,5)*proj.s}); }
  // camera follows the poop
  cam.tgt=clamp(H*0.5-proj.y, -H*0.05, H*0.34);
  el.distVal.textContent=zToM(f.z).toFixed(1);
  // ease slowmo back to normal
  slowmo+=(1-slowmo)*0.06;
  if(p>=1&&!f.landed){ f.landed=true; land(); }
}
function drawFly(){
  drawScene();
  drawAthlete(W*0.5+40, H*0.45, 1); // follow-through pose
  const f=fly; const proj=projFly();
  // moving shadow on ground
  const sgy=groundY(f.z);
  ctx.save(); ctx.globalAlpha=clamp(0.3-f.height/900,0.04,0.3); ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(proj.x,sgy,54*proj.s,14*proj.s,0,0,7); ctx.fill(); ctx.restore();
  // trail
  for(let i=0;i<f.trail.length;i++){
    const t=f.trail[i], a=i/f.trail.length;
    ctx.save(); ctx.globalAlpha=a*0.45; ctx.fillStyle='#c9a25c';
    ctx.beginPath(); ctx.ellipse(t.x,t.y,42*t.s*a,18*t.s*a,0,0,7); ctx.fill(); ctx.restore();
  }
  // speed lines
  ctx.save(); ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=2;
  for(let k=0;k<5;k++){ const off=(k-2)*10*proj.s;
    ctx.beginPath(); ctx.moveTo(proj.x-64*proj.s,proj.y+off); ctx.lineTo(proj.x-22*proj.s,proj.y+off); ctx.stroke(); }
  ctx.restore();
  drawParticles();
  drawPoop(proj.x,proj.y,58*proj.s,1+Math.sin(f.rot)*0.12,f.rot,f.rot*2, 0.6);
}
function land(){
  const f=fly, d=f.distance; camShake=16; slowmo=1;
  const proj=projFly();
  for(let i=0;i<30;i++){ const a=rand(0,7), sp=rand(1,5)*proj.s*1.6+1;
    particles.push({x:proj.x,y:proj.y,vx:Math.cos(a)*sp,vy:-Math.abs(Math.sin(a))*sp-1,life:1,c:'#7a4a1d',sz:rand(2,6)}); }
  // dust ring
  for(let i=0;i<16;i++){ const a=rand(0,7);
    particles.push({x:proj.x,y:proj.y,vx:Math.cos(a)*rand(1,4),vy:-rand(0.5,2),life:1,c:'#d8c9a0',sz:rand(3,7)*proj.s}); }
  decals.push({x:proj.x,y:proj.y,s:proj.s});
  tone(90,0.32,'square',0.25,40);
  el.distVal.textContent=d.toFixed(1);
  const r=rankFor(d);
  el.shout.textContent=r.shout;
  el.shout.classList.remove('go'); void el.shout.offsetWidth; el.shout.classList.add('go');
  speak(r.voice); cheer(r.cheer); setCrowd(0.02);
  setTimeout(()=>showResult(d,r), 1150);
}
function rankFor(d){
  if(d>=115) return {shout:'神ウンコ！！！',voice:'かみウンコー！',rank:'👑 神ウンコ',emoji:'👑',cheer:1.0};
  if(d>=90)  return {shout:'スーパーウンコ！！',voice:'スーパーウンコ！',rank:'🌟 スーパーウンコ',emoji:'🌟',cheer:0.85};
  if(d>=58)  return {shout:'ナイスウンコ！！',voice:'ナイスウンコ！',rank:'✨ ナイスウンコ',emoji:'✨',cheer:0.65};
  if(d>=32)  return {shout:'いいウンコ！',voice:'いいウンコ！',rank:'👍 いいウンコ',emoji:'👍',cheer:0.4};
  return {shout:'ざんねんウンコ…',voice:'ざんねん',rank:'💧 ざんねんウンコ',emoji:'💧',cheer:0.15};
}
function showResult(d,r){
  state=STATE.RESULT;
  const isRecord = d>best;
  if(isRecord){ best=d; localStorage.setItem('unkoman_best',best.toFixed(2)); spawnConfetti(); }
  el.bestVal.textContent=best.toFixed(1);
  el.resRank.innerHTML=r.rank + (isRecord?'<span class="newrec">🆕新記録</span>':'');
  el.resEmoji.textContent=r.emoji; el.resBest.textContent='ベスト '+best.toFixed(1)+' m';
  // rolling number
  tweenNumber(el.resDist, 0, d, 800);
  el.resultScreen.classList.remove('hidden');
}
function tweenNumber(node, from, to, dur){
  const t0=performance.now();
  function step(now){ const k=Math.min(1,(now-t0)/dur); const v=from+(to-from)*(1-Math.pow(1-k,3));
    node.textContent=v.toFixed(1); if(k<1) requestAnimationFrame(step); }
  requestAnimationFrame(step);
}

// ---------- particles ----------
function spawnConfetti(){
  const cols=['#ff5a5a','#ffd23d','#5ad17a','#5ab0ff','#ff8adf','#fff'];
  for(let i=0;i<120;i++) confetti.push({x:rand(0,W),y:rand(-H*0.3,0),vx:rand(-1.5,1.5),vy:rand(2,6),
    rot:rand(0,7),vr:rand(-0.3,0.3),w:rand(6,12),h:rand(8,16),c:cols[i%cols.length],life:1});
}
function drawParticles(){
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.35; p.life-=0.025;
    if(p.life<=0){ particles.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz,0,7); ctx.fill(); ctx.restore(); }
}
function drawSparkles(){
  for(let i=sparkles.length-1;i>=0;i--){ const s=sparkles[i];
    s.x+=s.vx; s.y+=s.vy; s.life-=0.04;
    if(s.life<=0){ sparkles.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha=Math.max(0,s.life); ctx.fillStyle=s.c;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.sz,0,7); ctx.fill(); ctx.restore(); }
}
function drawDecals(){
  for(const d of decals){ ctx.save(); ctx.globalAlpha=.8; ctx.fillStyle='#5e3914';
    ctx.beginPath(); ctx.ellipse(d.x,d.y,30*d.s,11*d.s,0,0,7); ctx.fill();
    ctx.fillStyle='#7a4a1d'; ctx.beginPath(); ctx.ellipse(d.x,d.y-3*d.s,16*d.s,8*d.s,0,0,7); ctx.fill();
    ctx.restore(); }
}
function drawConfetti(){
  for(let i=confetti.length-1;i>=0;i--){ const c=confetti[i];
    c.x+=c.vx; c.y+=c.vy; c.rot+=c.vr; c.vy+=0.04;
    if(c.y>H+30){ confetti.splice(i,1); continue; }
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot); ctx.fillStyle=c.c;
    ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h); ctx.restore(); }
}

// ---------- vignette ----------
function drawVignette(){
  ctx.save();
  const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.4,W/2,H/2,Math.max(W,H)*0.75);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,0.28)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H); ctx.restore();
}

// ---------- loop ----------
function frame(){
  time++;
  // camera smoothing
  cam.y+=(cam.tgt-cam.y)*0.12;
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(camShake>0){ ctx.translate(rand(-camShake,camShake),rand(-camShake,camShake)); camShake*=0.88; if(camShake<0.4)camShake=0; }
  ctx.translate(0, cam.y);

  if(state===STATE.TITLE){ drawScene(); drawDecals(); drawAthlete(W*0.5,H*0.60,0); }
  else if(state===STATE.CHARGE){ updateCharge(); drawDecals(); drawCharge(); }
  else if(state===STATE.FLY){ updateFly(); drawDecals(); drawFly(); }
  else if(state===STATE.RESULT){ drawScene(); drawDecals(); drawAthlete(W*0.5+40,H*0.45,1); drawParticles(); }

  ctx.restore();
  // screen-space overlays
  if(flash>0){ ctx.save(); ctx.globalAlpha=flash; ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); ctx.restore(); flash*=0.82; if(flash<0.02)flash=0; }
  drawVignette();
  drawConfetti();
  requestAnimationFrame(frame);
}
frame();

el.startBtn.addEventListener('click', startCharge);
el.retryBtn.addEventListener('click', startCharge);

})();
</script>
