<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>タイムラプス</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>タイムラプス</h1>
  </header>

  <main class="layout">
    <section class="stage">
      <div class="video-wrap">
        <!-- ライブプレビュー -->
        <video id="preview" playsinline muted></video>
        <!-- キャプチャ用の隠しキャンバス -->
        <canvas id="capture" hidden></canvas>
        <!-- 撮影済みフレームの再生プレビュー -->
        <canvas id="playback" hidden></canvas>
        <!-- オニオンスキン: 直前フレームをライブ映像に重ねる -->
        <canvas id="onion" class="onion-overlay" hidden></canvas>
        <!-- 佐藤。風キャプション（中央・白文字） -->
        <div id="captionOverlay" class="caption-overlay"></div>

        <div id="overlay" class="overlay">
          <span id="recDot" class="rec-dot" hidden></span>
          <span id="frameCounter" class="frame-counter">0 フレーム</span>
        </div>

        <div id="emptyState" class="empty-state">
          <p>カメラを開始してください</p>
        </div>
      </div>

      <div class="transport">
        <button id="startCam" class="btn">カメラを開始</button>
        <button id="recordBtn" class="btn btn-primary" disabled>撮影開始</button>
        <button id="shutterBtn" class="btn" disabled>1コマ撮影</button>
        <button id="playBtn" class="btn" disabled>プレビュー再生</button>
        <button id="exportBtn" class="btn" disabled>書き出し</button>
        <button id="clearBtn" class="btn btn-ghost" disabled>クリア</button>
      </div>

      <div id="status" class="status"></div>

      <div id="result" class="result" hidden>
        <video id="resultVideo" controls playsinline loop></video>
        <div class="result-actions">
          <button id="shareBtn" class="btn btn-primary" hidden>保存・共有</button>
          <a id="downloadLink" class="btn" download>ダウンロード</a>
        </div>
        <p class="result-hint">iPhoneは「保存・共有」→「ビデオを保存」で写真に入ります。</p>
      </div>
    </section>

    <aside class="settings">
      <label class="field">
        <span>キャプション</span>
        <input type="text" id="captionText" placeholder="例: ご飯食べた" maxlength="40" />
      </label>

      <label class="field inline">
        <span>撮影間隔</span>
        <div class="row">
          <input type="number" id="intervalValue" min="0.1" step="0.1" value="1" />
          <select id="intervalUnit">
            <option value="1000">秒</option>
            <option value="60000">分</option>
          </select>
        </div>
      </label>

      <label class="field inline">
        <span>カメラ</span>
        <select id="cameraSelect">
          <option value="environment">背面カメラ</option>
          <option value="user">前面カメラ</option>
        </select>
      </label>

      <label class="field inline">
        <span>再生方向</span>
        <select id="playDirection">
          <option value="forward">順再生</option>
          <option value="reverse">逆再生</option>
          <option value="boomerang">ブーメラン</option>
        </select>
      </label>

      <label class="field">
        <span>再生速度 <b id="fpsLabel">15</b> fps</span>
        <input type="range" id="fps" min="1" max="60" value="15" />
      </label>

      <label class="field checkbox">
        <span>オニオンスキン</span>
        <input type="checkbox" id="onionSkin" />
      </label>
      <label class="field" id="onionOpacityField" hidden>
        <span>オニオン濃度 <b id="onionOpacityLabel">40</b>%</span>
        <input type="range" id="onionOpacity" min="10" max="80" value="40" />
      </label>

      <label class="field checkbox">
        <span>タイムスタンプ</span>
        <input type="checkbox" id="showTimestamp" />
      </label>

      <div class="info-box">
        <dl>
          <dt>フレーム数</dt><dd id="sumFrames">0</dd>
          <dt>想定再生時間</dt><dd id="sumDuration">0.0 秒</dd>
          <dt>実撮影時間</dt><dd id="sumElapsed">0 秒</dd>
        </dl>
      </div>
    </aside>
  </main>

  <footer class="app-footer">
    <span>すべてブラウザ内で処理され、映像は外部に送信されません。</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
